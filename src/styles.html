<style>
  /* ─── Variables globales ─────────────────────────────────────────────── */
  :root {
    --color-primary:      #1e40af;
    --color-primary-dark: #1e3a8a;
    --color-primary-bg:   #eff6ff;
    --color-alert:        #f472b6;
    --color-border:       #e2e8f0;
    --color-bg:           #f8fafc;
    --radius-card:        0.75rem;
    --transition-fast:    0.15s ease;
  }

  /* ─── Reset & base ───────────────────────────────────────────────────── */
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--color-bg);
    margin: 0;
  }

  /* ─── Layout ─────────────────────────────────────────────────────────── */
  .sidebar {
    width: 380px;
    border-right: 1px solid var(--color-border);
    overflow-y: auto;
    height: 100%;
    background: white;
    flex-shrink: 0;
  }

  .main-content {
    flex: 1;
    overflow-y: hidden;
    display: flex;
    flex-direction: column;
  }

  .scrollable-area {
    flex: 1;
    overflow-y: auto;
    padding: 2.5rem;
  }

  /* ─── Estados de factura ─────────────────────────────────────────────── */
  .tachado .info-factura {
    text-decoration: line-through;
    opacity: 0.5;
  }

  .tachado {
    background-color: var(--color-primary-bg) !important;
    border-left: 4px solid var(--color-primary) !important;
  }

  .manual-selected {
    border: 2px solid var(--color-primary) !important;
    background-color: var(--color-primary-bg) !important;
  }

  /* ─── Utilidades ─────────────────────────────────────────────────────── */
  .text-pink-alert      { color: var(--color-alert); }
  .disabled-overlay     { pointer-events: none; opacity: 0.4; filter: grayscale(0.8); }

  /* ─── Toggle switch ──────────────────────────────────────────────────── */
  .switch               { position: relative; display: inline-block; width: 44px; height: 20px; }
  .switch input         { opacity: 0; width: 0; height: 0; }
  .slider               { position: absolute; cursor: pointer; inset: 0; background-color: #cbd5e1; transition: var(--transition-fast); border-radius: 20px; }
  .slider::before       { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: var(--transition-fast); border-radius: 50%; }
  input:checked + .slider            { background-color: var(--color-primary); }
  input:checked + .slider::before    { transform: translateX(24px); }

  /* ─── Toast de notificación ──────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 3rem;
    left: 50%;
    transform: translateX(-50%) translateY(1rem);
    background: #1e293b;
    color: white;
    padding: 0.6rem 1.25rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 9999;
    white-space: nowrap;
  }
  #toast.show  { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: #dc2626; }

  /* ─── Estilos de impresión ───────────────────────────────────────────── */
  @media print {
    .no-print         { display: none !important; }
    body              { background: white; height: auto; overflow: visible; display: block; }
    .main-content     { padding: 0; display: block; overflow: visible; }
    .scrollable-area  { padding: 0; overflow: visible; }
    .print-header     { display: block !important; border-bottom: 2px solid var(--color-border); margin-bottom: 2rem; padding-bottom: 1rem; }
    #footerTotals     { display: block !important; position: static !important; box-shadow: none !important; border: 2px solid var(--color-border) !important; margin-top: 2rem !important; border-radius: 1rem !important; }
    .grid             { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; }
  }
</style>
